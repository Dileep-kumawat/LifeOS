name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check OpenAPI coverage (fail on undocumented routes)
        run: npm run check:openapi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build Storybook (catches broken stories)
        run: npm run build-storybook --workspace=web
