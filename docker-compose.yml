version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: lifeos_mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: lifeos
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: lifeos_server
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/lifeos
      - JWT_SECRET=super-secret-production-key-lifeos-2026
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: lifeos_web
    restart: always
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  mongo_data:
